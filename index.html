<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラッテル ‐ Rattel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0e0b08;
    --panel:#1b140d;
    --panel-line:#3a2c1a;
    --gold:#c9a24b;
    --gold-bright:#e8c874;
    --turq:#3e9c93;
    --turq-dim:#245a54;
    --oxide:#a23b2e;
    --papyrus:#ead9b4;
    --papyrus-dim:#a9926a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #241a10 0%, var(--void) 55%),
      var(--void);
    color:var(--papyrus);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  /* hieroglyph border strip */
  .glyph-strip{
    width:100%;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    background:linear-gradient(180deg, #241a10, transparent);
    border-bottom:1px solid var(--panel-line);
    overflow:hidden;
  }
  .glyph-strip svg{width:18px;height:18px;opacity:.55;flex:none;}
  .glyph-strip svg .g-line{stroke:var(--gold);}

  .hero{
    max-width:760px;
    width:100%;
    padding:64px 24px 40px;
    text-align:center;
    position:relative;
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--turq);
    margin-bottom:18px;
  }

  h1.title{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:clamp(44px, 9vw, 84px);
    margin:0;
    letter-spacing:.03em;
    color:var(--gold-bright);
    text-shadow:0 0 40px rgba(201,162,75,.25);
    line-height:1.05;
  }
  .title small{
    display:block;
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:20px;
    color:var(--papyrus-dim);
    letter-spacing:.08em;
    margin-top:10px;
  }

  .lede{
    margin:28px auto 0;
    max-width:520px;
    font-size:19px;
    line-height:1.9;
    color:var(--papyrus);
  }

  .cta{
    margin-top:40px;
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:16px 40px;
    font-family:'Cinzel', serif;
    font-weight:500;
    font-size:17px;
    letter-spacing:.08em;
    color:var(--void);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:1px solid #8a6a2e;
    border-radius:2px;
    text-decoration:none;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 0 0 rgba(201,162,75,0);
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(201,162,75,.35);
  }
  .cta:focus-visible{
    outline:2px solid var(--turq);
    outline-offset:4px;
  }
  .glossary-link{
    display:block;
    width:max-content;
    margin:16px auto 0;
    padding:10px 28px;
    font-family:'Cinzel',serif;
    font-size:14px;
    color:var(--gold-bright);
    background:transparent;
    border:1px solid var(--gold);
    border-radius:4px;
    text-decoration:none;
    transition:background .15s ease, transform .15s ease;
  }
  .glossary-link:hover{
    background:rgba(201,162,75,.12);
    transform:translateY(-2px);
  }

  .cta .arrow{transition:transform .15s ease;}
  .cta:hover .arrow{transform:translateX(4px);}

  /* glossary */
  .glossary{
    width:100%;
    max-width:880px;
    margin:56px 0 80px;
    padding:0 24px;
  }
  .glossary-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:22px;
  }
  .glossary-head h2{
    font-family:'Cinzel', serif;
    font-size:22px;
    color:var(--gold);
    letter-spacing:.06em;
    margin:0;
    white-space:nowrap;
  }
  .glossary-head .rule{
    height:1px;
    width:100%;
    background:linear-gradient(90deg, var(--panel-line), transparent);
  }

  .term-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:1px;
    background:var(--panel-line);
    border:1px solid var(--panel-line);
  }
  .term{
    background:var(--panel);
    padding:18px 20px;
  }
  .term .word{
    font-family:'Space Mono', monospace;
    color:var(--turq);
    font-size:15px;
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .term .word .kana{color:var(--gold-bright);}
  .term .desc{
    font-size:15px;
    line-height:1.6;
    color:var(--papyrus-dim);
  }
  .term.direction .word{color:var(--gold-bright);}

  footer{
    padding:30px 24px 50px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.15em;
    color:#5a4a30;
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: no-preference){
    .title{animation:rise .9s ease both;}
    .lede{animation:rise .9s .1s ease both;}
    .cta{animation:rise .9s .2s ease both;}
    @keyframes rise{
      from{opacity:0; transform:translateY(14px);}
      to{opacity:1; transform:translateY(0);}
    }
  }
</style>
</head>
<body>

  <div class="glyph-strip" aria-hidden="true" id="glyphStrip"></div>

  <div class="hero">
    <div class="eyebrow">EGYPTIAN CARD RITE</div>
    <h1 class="title">ラッテル
      <small>RATTEL — 声ではなく、正しい言葉で運命を交換する</small>
    </h1>
    <p class="lede">
      手札を交換し、役を揃え、時に冥界へ堕ちる。
      合図は音声ではなくコマンド。正しい呪語を、正しい順序で選べ。
    </p>
    <a class="cta" href="setup.html">
      冒険を始める
      <span class="arrow">→</span>
    </a>
    <a class="glossary-link" href="glossary.html">用語集を見る</a>
  </div>
  <footer>RATTEL // A HAND-EXCHANGE RITE FOR THE LIVING AND THE DEAD</footer>

<script>
// Populate the hieroglyph strip with a repeating hand-drawn icon set (ankh, eye, sun disc, pyramid)
(function(){
  const icons = [
    // ankh
    `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle class="g-line" cx="12" cy="6" r="3.4" stroke-width="1.4"/><path class="g-line" d="M12 9.4V21M6.5 13H17.5" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    // eye of horus (simplified)
    `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="g-line" d="M2 12C6 7 18 7 22 12C18 15 6 15 2 12Z" stroke-width="1.3"/><circle class="g-line" cx="12" cy="12" r="2.2" stroke-width="1.3"/><path class="g-line" d="M12 14.2V19M12 19L9.5 21.5M15 8L18 6" stroke-width="1.3" stroke-linecap="round"/></svg>`,
    // sun disc
    `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle class="g-line" cx="12" cy="12" r="4.5" stroke-width="1.3"/><path class="g-line" d="M12 2V4.5M12 19.5V22M2 12H4.5M19.5 12H22M4.9 4.9L6.6 6.6M17.4 17.4L19.1 19.1M19.1 4.9L17.4 6.6M6.6 17.4L4.9 19.1" stroke-width="1.3" stroke-linecap="round"/></svg>`,
    // pyramid
    `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="g-line" d="M12 4L21 20H3L12 4Z" stroke-width="1.3" stroke-linejoin="round"/><path class="g-line" d="M8.3 14H15.7" stroke-width="1"/></svg>`
  ];
  const strip = document.getElementById('glyphStrip');
  let html = '';
  for(let i=0;i<18;i++){ html += icons[i % icons.length]; }
  strip.innerHTML = html;
})();
</script>
</body>
</html>
